<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>@basementuniverse/chart demos</title>
	<style>
		body {
			margin: 24px;
			font-family: sans-serif;
		}

		h2 {
			margin: 20px 0 8px;
			font-size: 16px;
			font-weight: 600;
		}

		canvas {
			display: block;
			margin: 0 0 24px;
			border: 1px solid #000;
		}
	</style>
</head>
<body>
	<h2>1. Line chart with number[] shorthand</h2>
	<canvas id="line-numbers" width="720" height="260"></canvas>

	<h2>2. Area chart with null gaps</h2>
	<canvas id="area-null-gaps" width="720" height="260"></canvas>

	<h2>3. Bar chart with category labels ({ x, y }[])</h2>
	<canvas id="bar-categories" width="720" height="260"></canvas>

	<h2>4. Scatter chart with explicit numeric range</h2>
	<canvas id="scatter-range" width="720" height="260"></canvas>

	<h2>5. Mixed series types in one chart</h2>
	<canvas id="mixed-types" width="720" height="280"></canvas>

	<h2>6. Time-series points ({ x: Date, y }[])</h2>
	<canvas id="time-series" width="720" height="260"></canvas>

	<h2>7. Axis styling and custom label formatters</h2>
	<canvas id="styled-axis" width="720" height="260"></canvas>

	<script src="build/index.js"></script>
	<script>
		const drawChart = window.drawChart || window.default;

		function ctx(id) {
			return document.getElementById(id).getContext('2d');
		}

		drawChart(ctx('line-numbers'), {
			type: 'line',
			title: { text: 'Visits per Day' },
			series: [
				{
					name: 'Visits',
					data: [12, 18, 16, 24, 31, 28, 35],
				},
			],
		});

		drawChart(ctx('area-null-gaps'), {
			type: 'area',
			title: { text: 'Area Series with Missing Values' },
			series: [
				{
					name: 'Load',
					data: [
						{ x: 0, y: 8 },
						{ x: 1, y: 11 },
						{ x: 2, y: null },
						{ x: 3, y: 15 },
						{ x: 4, y: 13 },
						{ x: 5, y: null },
						{ x: 6, y: 18 },
						{ x: 7, y: 16 },
					],
				},
			],
			yAxis: {
				range: {
					includeZero: true,
				},
			},
		});

		drawChart(ctx('bar-categories'), {
			type: 'bar',
			title: { text: 'Monthly Revenue' },
			series: [
				{
					name: '2026',
					data: [
						{ x: 'Jan', y: 120 },
						{ x: 'Feb', y: 132 },
						{ x: 'Mar', y: 126 },
						{ x: 'Apr', y: 145 },
						{ x: 'May', y: 151 },
					],
					color: '#d9480f',
					fill: 'rgba(217, 72, 15, 0.35)',
				},
			],
			yAxis: {
				formatter: function (value) {
					return '$' + value + 'k';
				},
			},
		});

		drawChart(ctx('scatter-range'), {
			type: 'scatter',
			title: { text: 'Experiment Results' },
			series: [
				{
					name: 'Run A',
					pointRadius: 5,
					color: '#0b7285',
					fill: 'rgba(11, 114, 133, 0.4)',
					data: [
						{ x: 0, y: 12 },
						{ x: 5, y: 16 },
						{ x: 10, y: 20 },
						{ x: 15, y: 18 },
						{ x: 20, y: 24 },
					],
				},
			],
			xAxis: {
				range: { min: 0, max: 25 },
			},
			yAxis: {
				range: { min: 0, max: 30 },
			},
		});

		drawChart(ctx('mixed-types'), {
			title: { text: 'Mixed: Bars + Line + Scatter' },
			series: [
				{
					type: 'bar',
					name: 'Signups',
					data: [
						{ x: 'Mon', y: 20 },
						{ x: 'Tue', y: 25 },
						{ x: 'Wed', y: 23 },
						{ x: 'Thu', y: 29 },
						{ x: 'Fri', y: 32 },
					],
				},
				{
					type: 'line',
					name: 'Trend',
					data: [
						{ x: 'Mon', y: 18 },
						{ x: 'Tue', y: 22 },
						{ x: 'Wed', y: 24 },
						{ x: 'Thu', y: 27 },
						{ x: 'Fri', y: 31 },
					],
				},
				{
					type: 'scatter',
					name: 'Targets',
					data: [
						{ x: 'Mon', y: 21 },
						{ x: 'Tue', y: 21 },
						{ x: 'Wed', y: 26 },
						{ x: 'Thu', y: 28 },
						{ x: 'Fri', y: 30 },
					],
				},
			],
			yAxis: {
				range: {
					includeZero: true,
				},
			},
		});

		drawChart(ctx('time-series'), {
			type: 'line',
			title: { text: 'Temperature (Date x-values)' },
			series: [
				{
					name: 'Temp C',
					data: [
						{ x: new Date('2026-01-01'), y: 6 },
						{ x: new Date('2026-01-02'), y: 8 },
						{ x: new Date('2026-01-03'), y: 7 },
						{ x: new Date('2026-01-04'), y: 10 },
						{ x: new Date('2026-01-05'), y: 9 },
					],
					color: '#1971c2',
					width: 2,
				},
			],
			xAxis: {
				ticks: 5,
				formatter: function (value) {
					const date = value instanceof Date ? value : new Date(value);
					return (date.getMonth() + 1) + '/' + date.getDate();
				},
			},
			yAxis: {
				formatter: function (value) {
					return value + ' C';
				},
			},
		});

		drawChart(ctx('styled-axis'), {
			type: 'line',
			background: '#f8f9fa',
			padding: { top: 30, right: 22, bottom: 40, left: 52 },
			title: {
				text: 'Custom Axis Style',
				color: '#212529',
				font: 'bold 15px sans-serif',
				align: 'center',
			},
			axisStyle: {
				axisColor: '#212529',
				axisWidth: 1.5,
				gridColor: '#dee2e6',
				gridWidth: 1,
				tickColor: '#343a40',
				tickWidth: 1,
				tickLength: 6,
				labelColor: '#212529',
				labelFont: '12px monospace',
				labelOffset: 8,
			},
			xAxis: {
				grid: true,
				ticks: 7,
			},
			yAxis: {
				grid: true,
				ticks: 5,
				formatter: function (value) {
					return value + '%';
				},
				range: {
					min: 0,
					max: 100,
				},
			},
			series: [
				{
					name: 'Completion',
					data: [14, 28, 36, 49, 58, 71, 84],
					color: '#6741d9',
					width: 2.5,
				},
			],
		});
	</script>
</body>
</html>
